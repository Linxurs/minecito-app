<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecito v1.5.6</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: #f0f0f0;">
    <div id="main-window">
        <label style="position: absolute; left: 5px; top: 5px;">Nombre de Usuario:</label>
        <div class="combobox" id="combobox-username" style="position: absolute; left: 120px; top: 5px; width: 140px;">
            <input type="text" id="username" autocomplete="off">
            <button type="button" id="combo-btn" aria-label="Desplegar lista">▼</button>
            <ul id="combo-dropdown"></ul>
        </div>
        <button id="btn-random" style="position: absolute; left: 270px; top: 5px; width: 25px; height: 22px; box-sizing: border-box;">R</button>

        <label style="position: absolute; left: 35px; top: 35px;">Versión:</label>
        <div class="combobox combobox-readonly" id="combobox-version" style="position: absolute; left: 120px; top: 35px; width: 140px;">
            <input type="text" id="version" readonly autocomplete="off">
            <button type="button" id="version-combo-btn" aria-label="Desplegar versiones">▼</button>
            <ul id="version-dropdown"></ul>
        </div>

        <div style="position: absolute; left: 25px; top: 65px; display: flex; gap: 4px;">
            <label><input type="checkbox" id="chk-snapshot"> Snapshot</label>
            <label><input type="checkbox" id="chk-beta"> Beta</label>
            <label><input type="checkbox" id="chk-alpha"> Alpha</label>
            <label><input type="checkbox" id="chk-especial"> Especial</label>
        </div>

        <label id="label-uuid" style="position: absolute; left: 40px; top: 95px; display: none;">UUID:</label>
        <input type="text" id="custom-uuid" style="position: absolute; left: 120px; top: 95px; width: 140px; display: none;">

        <button id="btn-launch" style="position: absolute; left: 45px; top: 96px;">¡Iniciar Minecraft!</button>
        <button id="btn-close-game" style="position: absolute; left: 155px; top: 96px;" disabled>¡Cerrar Minecraft!</button>
        <button id="btn-toggle-advanced" style="position: absolute; left: 90px; top: 130px; width: 125px;">Opciones Avanzadas</button>
        
        <!-- Log window -->
        <div id="log-frame" style="position: absolute; left: 305px; top: 5px; width: 520px; height: 150px; display: none;">
            <textarea id="log-text" readonly style="width: 100%; height: 100%; box-sizing: border-box; resize: none;"></textarea>
        </div>
    </div>

    <!-- Hidden progress for logic compatibility without breaking UI -->
    <div id="progress-container" style="display: none;">
        <span id="progress-status"></span>
        <span id="progress-percent"></span>
        <div id="progress-bar-fill"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
